name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  molecule-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Verify Podman is available
        run: podman --version

      - name: Install Ansible, Molecule, and test dependencies
        run: pip install ansible-core molecule molecule-plugins[podman] passlib

      - name: Install collections required by the Molecule Podman driver
        run: ansible-galaxy collection install containers.podman community.docker

      - name: Install roles and collections
        run: ansible-galaxy install -r requirements.yml

      - name: Molecule create
        run: molecule create

      - name: Molecule converge
        # Scoped to Level 1 controls for now - Level 2 hasn't been fully
        # proven out in this container scenario yet. Widen this once verified.
        run: molecule converge -- --tags level1-server,level1-workstation

      - name: Molecule verify
        run: molecule verify

      - name: Upload CIS audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cis-audit-report
          path: /tmp/audit_summaries/
          if-no-files-found: warn

      - name: Clean up Molecule instance
        if: always()
        run: molecule destroy
