---
dependency:
  name: galaxy
  options:
    role-file: requirements.yml
    requirements-file: requirements.yml

driver:
  name: podman

platforms:
  - name: rhel9-cis-molecule
    image: docker.io/almalinux/9-init:9
    command: /sbin/init
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw

provisioner:
  name: ansible
  log: true
  config_options:
    defaults:
      interpreter_python: auto_silent
      callbacks_enabled: profile_tasks, timer
  inventory:
    # Molecule's "links" and inline host_vars/group_vars config are mutually
    # exclusive (setting either disables the other's write path entirely),
    # so both our container overrides (host_vars/) and our real production
    # vars (sysconfig/group_vars/) have to go through links.
    links:
      group_vars: ../../sysconfig/group_vars
      host_vars: host_vars

verifier:
  name: ansible
